<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Five-step project initialization workflow"><title>Five-step project initialization workflow</title><rect width="1200" height="440" rx="24" fill="#0c1b30"/><text x="48" y="60" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="30" fill="#eef5ff" text-anchor="start" font-weight="600">From requirements to a development scaffold</text><text x="48" y="96" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="19" fill="#a7bdd9" text-anchor="start" font-weight="400">Five steps • User-led decisions • Validation before handoff</text><rect x="48" y="135" width="208" height="180" rx="18" fill="#172d49" stroke="#36516f"/><circle cx="78" cy="167" r="17" fill="#65e1c6"/><text x="78" y="173" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="17" fill="#0c1b30" text-anchor="middle" font-weight="700">1</text><text x="66" y="218" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="22" fill="#eef5ff" text-anchor="start" font-weight="600">Understand</text><text x="66" y="254" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="17" fill="#b6cbe2" text-anchor="start" font-weight="400">Read the template</text><text x="66" y="282" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="17" fill="#b6cbe2" text-anchor="start" font-weight="400">and operating agreement</text><rect x="272" y="135" width="208" height="180" rx="18" fill="#172d49" stroke="#36516f"/><circle cx="302" cy="167" r="17" fill="#65e1c6"/><text x="302" y="173" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="17" fill="#0c1b30" text-anchor="middle" font-weight="700">2</text><text x="290" y="218" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="22" fill="#eef5ff" text-anchor="start" font-weight="600">Ask five</text><text x="290" y="254" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="17" fill="#b6cbe2" text-anchor="start" font-weight="400">Gather scope and limits</text><text x="290" y="282" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="17" fill="#b6cbe2" text-anchor="start" font-weight="400">and the destination</text><rect x="496" y="135" width="208" height="180" rx="18" fill="#172d49" stroke="#36516f"/><circle cx="526" cy="167" r="17" fill="#65e1c6"/><text x="526" y="173" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="17" fill="#0c1b30" text-anchor="middle" font-weight="700">3</text><text x="514" y="218" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="22" fill="#eef5ff" text-anchor="start" font-weight="600">Review + clone</text><text x="514" y="254" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="17" fill="#b6cbe2" text-anchor="start" font-weight="400">Choose a suitable layout</text><text x="514" y="282" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="17" fill="#b6cbe2" text-anchor="start" font-weight="400">Clone into the workspace</text><rect x="720" y="135" width="208" height="180" rx="18" fill="#172d49" stroke="#36516f"/><circle cx="750" cy="167" r="17" fill="#65e1c6"/><text x="750" y="173" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="17" fill="#0c1b30" text-anchor="middle" font-weight="700">4</text><text x="738" y="218" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="22" fill="#eef5ff" text-anchor="start" font-weight="600">Adapt</text><text x="738" y="254" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="17" fill="#b6cbe2" text-anchor="start" font-weight="400">Set paths and roles</text><text x="738" y="282" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="17" fill="#b6cbe2" text-anchor="start" font-weight="400">Add plans and credit</text><rect x="944" y="135" width="208" height="180" rx="18" fill="#172d49" stroke="#36516f"/><circle cx="974" cy="167" r="17" fill="#65e1c6"/><text x="974" y="173" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="17" fill="#0c1b30" text-anchor="middle" font-weight="700">5</text><text x="962" y="218" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="22" fill="#eef5ff" text-anchor="start" font-weight="600">Validate</text><text x="962" y="254" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="17" fill="#b6cbe2" text-anchor="start" font-weight="400">Check consistency</text><text x="962" y="282" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="17" fill="#b6cbe2" text-anchor="start" font-weight="400">Ask about appearance</text><rect x="48" y="343" width="1104" height="67" rx="18" fill="#153b43" stroke="#58bfaf"/><text x="600" y="385" font-family="Segoe UI, Noto Sans Thai, Tahoma, sans-serif" font-size="24" fill="#d7fff5" text-anchor="middle" font-weight="400">“The project structure is ready. What should the interface look like?”</text></svg>
